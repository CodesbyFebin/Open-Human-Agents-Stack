name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Import check
        run: |
          python -c "from backend.main import app; print('control plane import ok')"
          python -c "from backend.pipeline.node_pipeline import NodePipelineGenerator; print('pipeline import ok')"
      - name: Unit tests
        run: pytest -q tests/ || true
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm install
      - name: Type check (blocking)
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
