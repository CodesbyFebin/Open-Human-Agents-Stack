name: Pipeline gates

on:
  pull_request:
    paths:
      - "backend/pipeline/**"
      - "tests/test_pipeline_fail_closed.py"
      - ".github/workflows/pipeline-gates.yml"
  workflow_dispatch:

jobs:
  negative-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest pytest-asyncio sqlalchemy asyncpg structlog
      - run: pytest -q tests/test_pipeline_fail_closed.py
